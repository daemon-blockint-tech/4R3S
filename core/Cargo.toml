[workspace]
members = [
    "crates/ares-cli",
    "crates/ares-core",
    "crates/ares-trident",
    "crates/ares-mapper",
    "crates/ares-policy",
    "crates/ares-orchestrator",
    "crates/ares-report",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["ARES Team"]
license = "MIT"
repository = "https://github.com/daemon-blockint-tech/ARES-v3"

[workspace.dependencies]
# CLI & Async
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TUI & Prompts
ratatui = "0.30.2"
crossterm = "0.29.0"
tui-textarea = { package = "tui-textarea-2", version = "0.12.1" }
syntect = "5.2"
dialoguer = "0.12.0"
textwrap = "0.16.1"
regex = "1.11"

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
config = "0.15"

# HTTP & API
reqwest = { version = "0.13", features = ["json"] }

# Filesystem & Process
walkdir = "2.5"
tempfile = "3.13"
which = "8.0"
rayon = "1.10"

# AST / Parsing
syn = { version = "3.0", features = ["full", "visit"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }

# Crypto / Hashing
sha2 = "0.11"

# Testing
pretty_assertions = "1.4"

# Internal workspace crates.
# The `version` is not decoration and is not redundant with `path`: `cargo
# publish` strips path dependencies and hard-errors with "all dependencies must
# have a version requirement specified when publishing" without it, so a
# path-only declaration here makes every dependent crate unpublishable. It must
# stay in step with workspace.package.version above — cargo cannot inherit into
# workspace.dependencies, so this is the one version that has to be repeated.
ares-core = { path = "crates/ares-core", version = "0.1.0" }
ares-trident = { path = "crates/ares-trident", version = "0.1.0" }
ares-mapper = { path = "crates/ares-mapper", version = "0.1.0" }
ares-policy = { path = "crates/ares-policy", version = "0.1.0" }
ares-orchestrator = { path = "crates/ares-orchestrator", version = "0.1.0" }
ares-report = { path = "crates/ares-report", version = "0.1.0" }
