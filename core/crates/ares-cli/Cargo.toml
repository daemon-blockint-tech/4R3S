[package]
name = "ares-v3"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ARES V3 CLI — Autonomous Solana Security Auditor"

[[bin]]
name = "ares"
path = "src/main.rs"

[dependencies]
ares-core = { workspace = true }
ares-trident = { workspace = true }
ares-mapper = { workspace = true }
ares-policy = { workspace = true }
ares-orchestrator = { workspace = true }
ares-report = { workspace = true }

clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

ratatui = { workspace = true }
crossterm = { workspace = true }
tui-textarea = { workspace = true }
syntect = { workspace = true }
dialoguer = { workspace = true }
textwrap = { workspace = true }
regex = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
config = { workspace = true }
chrono = "0.4"
which = { workspace = true }
walkdir = { workspace = true }
# Pinned to 0.7 deliberately. `commands/pdf.rs` is written against the 0.7 API
# (PdfLayerReference / IndirectFontRef / use_text). 0.12 removed all three, so
# the automated 0.7 -> 0.12.5 bump did not compile and took Core CI red. For a
# 0.x crate a *minor* bump is a breaking change, which is why dependabot.yml
# now ignores minor updates here. Porting pdf.rs to the 0.12 API is real work,
# not a version pin — track it separately before unpinning.
printpdf = "0.7.0"

reqwest = { workspace = true }
tracing-appender = "0.2.5"

[features]
default = []
llm-judge = []

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
