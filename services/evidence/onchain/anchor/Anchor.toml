# Anchor workspace config for evidence_registry.
#
# NOTHING HERE HAS EVER RUN. There is no anchor CLI in this repository's CI or on
# the machine this was written on. The file exists so the first person to install
# the toolchain has a starting point, not because it has been exercised.

[toolchain]
# Pinned to match the exact `anchor-lang` pin in
# programs/evidence_registry/Cargo.toml. The account-discriminator scheme the
# layout table assumes is Anchor-version dependent, so these two must move
# together.
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Placeholder, matching declare_id! in the program source. Replaced once an
# operator generates the program keypair -- that keypair is a private key, so a
# human generates it and it is gitignored, never committed and never generated by
# CI or by an agent.
evidence_registry = "Evid1111111111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
# Localnet only. Deploying to devnet or mainnet is a deliberate operator action
# with its own runbook in ../README.md, not something a default should make easy:
# a devnet anchor is destroyed by the periodic cluster reset while looking
# identical to a real one, and a mainnet anchor spends real SOL irreversibly.
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "echo 'No JS test suite. The reject-path tests are the deferred work described in ../README.md.'"
