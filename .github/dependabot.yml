version: 2
updates:
  # npm dependencies — grouped into a single weekly PR to keep noise low. This
  # complements GitHub's security updates, which continue to open their own PRs.
  # apps/auditor-web gets no entry of its own: it is a pnpm workspace member
  # whose deps resolve into the root pnpm-lock.yaml, and dependabot updates
  # pnpm workspaces recursively from "/" (a subdirectory entry would conflict).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # typescript-eslint 8.x peer-caps TypeScript at <6.1.0, and its entry point
      # hard-throws on TS 7 ("typescript-eslint does not support TS 7"). A major
      # or minor TypeScript bump therefore breaks both `npm ci` (ERESOLVE) and
      # `npm run lint`, as the TS 7 bump in #13 did. Patch updates stay allowed.
      # Remove this once typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: npm
    directory: "/apps/ares-sec"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ares-sec-npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/apps/ares-sec/webui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ares-sec-webui-npm:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/core"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      core-cargo:
        patterns:
          - "*"
    ignore:
      # Cargo treats a 0.x *minor* bump as breaking, but dependabot labels it
      # "version-update:semver-minor" and the group rolls it up with unrelated
      # patches. That is exactly how printpdf went 0.7.0 -> 0.12.5 inside a PR
      # titled "2 updates" and took Core CI red: the 0.12 API dropped
      # PdfLayerReference, IndirectFontRef and use_text, which pdf.rs is built
      # on. Patches still flow; a minor bump on a 0.x crate now has to be a
      # deliberate port, which is what it always was.
      - dependency-name: "printpdf"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: pip
    directory: "/eval"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/apps/auditor-api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # redis's upper bound here belongs to arq (`redis[hiredis]<6,>=4.2.0`),
      # but requirements.txt states it as a bare pin, so dependabot bumped it
      # to 8.1.0 and made the file unsatisfiable. Patch/minor updates inside
      # 5.x still flow; crossing the major boundary requires arq to move first.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      # arq 0.28.0 — the latest release — requires `redis[hiredis]>=4.2.0,<6`.
      # #120 bumped redis to 8.1.0, which pip cannot resolve against that at all
      # (`ResolutionImpossible`), and the auditor-api job went red on main. No
      # newer arq lifts the cap, so any major or minor redis bump is guaranteed
      # to fail until arq moves. Patch updates stay allowed. Same shape as the
      # typescript ignore above: pin the thing whose upstream cannot accept it.
      - dependency-name: "redis"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # Keep the GitHub Actions used in .github/workflows pinned to current versions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
