name: auditor-web PR Checks

on:
  pull_request:
    branches: ['*']
    paths: ["apps/auditor-web/**"]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/auditor-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/auditor-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Run build
        run: npm run build
