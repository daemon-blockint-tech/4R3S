name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is ">=20"; exercise the floor and the current LTS.
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Node 20 and 22 both bundle npm 10, but the lockfile is resolved by npm 11
      # — the version this repo's developers and Dependabot actually run. The two
      # disagree: `ws@7` (via jayson) peers `utf-8-validate ^5.0.2` while `ws@8`
      # (via langsmith) peers `^6.0.0`. npm 11 dedupes to 6.0.6 and lets the
      # unsatisfiable peer stand; npm 10 demands a nested `utf-8-validate@5.0.10`
      # and aborts `npm ci` with "Missing ... from lock file".
      #
      # This has now taken main down twice, each time "fixed" by regenerating the
      # lockfile with npm 10 — which the next Dependabot npm PR silently undoes.
      # Pinning the version here fixes the disagreement instead of re-losing it.
      # engines.npm records the same requirement for humans.
      - name: Pin npm to the version that resolves the lockfile
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The suite is hermetic: env.ts gets a dummy key from vitest.config.ts and
      # Supabase/Neo4j/embeddings stay unset, so no external services are needed.
      - name: Test
        run: npm test

  audit:
    # This gate was previously absent because the unfixable `bigint-buffer`
    # advisory would have made every build red. That advisory reached the tree
    # only through `@solana/spl-token`, which nothing imported, so removing the
    # dependency cleared it at the root and the gate can now hold the line.
    # If it goes red, fix or justify the advisory — do not weaken the check.
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # See the note in `verify`: the lockfile is npm 11-resolved.
      - name: Pin npm to the version that resolves the lockfile
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and above)
        run: npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/requirements.txt

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r eval/requirements.txt
          pip-audit -r services/cve/requirements.txt
          pip-audit -r apps/auditor-api/requirements.txt

      # GOLDEN RULE 1: no strong-copyleft third-party dependency in a published
      # artifact. CLAUDE.md asserted "CI checks both" long before either half
      # existed; these two steps are what make that true. LGPL and permissive
      # pass by design — see scripts/check-licenses.mjs and deny.toml.
      #
      # The npm half walks the root tree *and* every apps/* package, so those
      # trees have to be installed here or the gate refuses to report a pass.
      # apps/auditor-web is the deployed dashboard and the reason this matters:
      # its 700+ production packages were outside the gate's reach entirely.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install app dependencies (license gate scope)
        run: |
          # --legacy-peer-deps is required, and only here.
          #
          # apps/ares-sec pins `typescript ~7.0.2`, and NO released
          # `typescript-eslint` supports it — 8.66.0, the latest, still peers
          # `typescript >=4.8.4 <6.1.0`. So `npm ci` fails ERESOLVE and takes the
          # whole licence gate down with it.
          #
          # This install exists to enumerate dependency LICENCES, not to build or
          # typecheck anything: the direct dependency set is identical either way,
          # so the scan is unaffected. Using the flag here does not paper over the
          # incompatibility for the app itself — `ares-sec-ci.yml` still builds it
          # normally and will keep failing until the versions are reconciled,
          # which is the right place for that to surface.
          npm ci --prefix apps/ares-sec --legacy-peer-deps
          pnpm install --dir apps/auditor-web --frozen-lockfile --ignore-scripts

      - name: License check (npm)
        run: node scripts/check-licenses.mjs

      - name: License check (cargo)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          command: check licenses bans sources

      # GOLDEN RULE 1, product/safety-boundary half: offensive tooling in
      # apps/ares-sec/ must never be imported into the defensive Auditor.
      # Deferred in CLAUDE.md until real code landed there (SEC-1) — it has.
      - name: Import-boundary check (ares-sec must stay out of the Auditor)
        run: node scripts/check-import-boundary.mjs

  eval-scorer:
    name: eval scorer (python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/requirements.txt

      - name: Install dependencies
        run: pip install -r eval/requirements.txt

      - name: Test
        run: python -m pytest eval -q

  auditor-api:
    # Without this job, apps/auditor-api's Python is never executed in CI: the
    # existing jobs cover root src/ (npm) and eval/ (pytest) only, so a green
    # run would mean "not checked", not "correct" — a false pass over a suite
    # that never ran.
    name: auditor-api (python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/auditor-api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/auditor-api/requirements.txt

      # Runs from the app directory because main.py/worker.py are imported as
      # top-level modules, and because REPO_ROOT is derived from __file__ —
      # exercising it from here is what catches the path depth being wrong.
      - name: Test
        working-directory: apps/auditor-api
        run: python -m pytest -q

  services-cve:
    # Same rationale as the auditor-api job above: without this job,
    # services/cve's Python is never executed in CI, so a green run would
    # mean "not checked", not "correct". This suite's load-bearing test
    # (test_snapshot_integrity.py) runs the version-range parser against
    # every range in the real committed snapshot, not just hand-written
    # fixtures — it is what would catch a bad refresh_snapshot.py run before
    # merge.
    name: services-cve (python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cve/requirements.txt

      - name: Install dependencies
        run: pip install -r services/cve/requirements.txt

      - name: Test
        working-directory: services/cve
        run: python -m pytest -q

  verify-claims:
    name: Verify-Claims release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/requirements.txt

      - name: Install dependencies
        run: pip install -r eval/requirements.txt

      - name: Fetch ground truth
        run: |
          python eval/fetch_datasets.py --out-dir eval/data
          python eval/fetch_sealevel_attacks.py --out-dir eval/data
          python eval/fetch_neodyme_workshop.py --out-dir eval/data
          python eval/build_incident_repros.py --out-dir eval/data

      # ARES has no committed prediction output, so this scores synthetic
      # predictions to prove the gate accepts and rejects at the right F1.
      - name: Gate self-test
        run: python eval/gate_selftest.py --truth eval/data/ground_truth.csv --target-f1 0.94

      - name: Score ARES predictions
        id: score
        run: |
          if [ ! -f eval/predictions/ares-latest.csv ]; then
            echo "scored=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No eval/predictions/ares-latest.csv — ARES is UNSCORED. Any published F1 is unverified."
            exit 0
          fi
          echo "scored=true" >> "$GITHUB_OUTPUT"
          # Scored WITHOUT --target-f1, so this step fails only when scoring
          # itself fails. The target comparison moved to the reporting step
          # below — see the comment there for why it does not block.
          python eval/score_detections.py \
            --truth eval/data/ground_truth.csv \
            --predictions eval/predictions/ares-latest.csv \
            --by category severity \
            --json-out eval/data/score.json

      # Reported, not enforced — a deliberate split, not a weakened gate.
      #
      # The two checks in this job answer different questions. "Is every
      # published number re-derivable?" is a correctness property the project
      # controls, and it stays blocking (next step). "Did we hit F1 0.94?" is an
      # aspiration, and 0.94 specifically is the figure the root README already
      # DISOWNS — blocking CI on a number the project has itself retracted
      # protects nothing and trains people to ignore a red check.
      #
      # It is also not reachable on the committed corpus at all: measured
      # per-class recall caps total ~78 of 152 rows, so F1 caps near 0.68 at
      # perfect precision (docs/EVAL-2-REPRODUCTION-REPORT.md). The gap is a
      # dataset gap. Restore blocking when the corpus can support a target —
      # paired secure/insecure negatives are the work that moves the ceiling.
      - name: Report F1 against the target (informational)
        if: steps.score.outputs.scored == 'true'
        run: |
          python - <<'PY'
          import json, os
          s = json.load(open("eval/data/score.json"))["overall"]
          f1, target = s["f1"], 0.94
          line = f'measured F1 {f1:.4f} vs target {target}'
          if f1 + 1e-9 < target:
              print(f"::warning::{line} — NOT met (delta {f1 - target:+.4f}). "
                    "Not blocking: see the comment in ci.yml.")
          else:
              print(f"{line} — met")
          PY

      # GOLDEN RULE 3, guarded at the point the claim is made rather than after
      # it ships. `release: published` fires only once GitHub has created the
      # tag and the release page, so blocking there was a post-mortem — the red
      # check appeared and the release stayed up. There is no pre-publication
      # release event, so this checks the README on EVERY push instead: a number
      # nobody measured becomes a problem the moment it is merged, not released.
      - name: Verify published metrics are re-derivable
        run: python eval/check_published_claims.py

      # Backstop: a release must not ship unscored even if the README is silent.
      - name: Block unscored release
        if: github.event_name == 'release' && steps.score.outputs.scored != 'true'
        run: |
          echo "Release blocked: eval/predictions/ares-latest.csv is missing, so no F1 claim can be verified."
          exit 1

      - name: Upload score
        if: steps.score.outputs.scored == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ares-eval-score
          path: |
            eval/data/score.json
            eval/data/manifest.json
