name: Core Release

# Renamed from "Release" on import (ENG-1: pulled ARES-v3 in as core/).
# NOT VERIFIED as a real release run — path/working-directory fixes only,
# since actually triggering this would mean a real crates.io publish and
# GitHub release. Needs a real dry run by someone with repo access before
# the next tagged release actually goes out.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ares-linux-amd64
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ares-linux-arm64
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ares-macos-amd64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ares-macos-arm64
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ares-windows-amd64.exe
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Target
        if: matrix.use_cross == false
        run: cargo build --release --target ${{ matrix.target }} --bin ares

      - name: Build Target (Cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --bin ares

      - name: Prepare Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mv target/${{ matrix.target }}/release/ares ${{ matrix.artifact_name }}
          chmod +x ${{ matrix.artifact_name }}

      - name: Prepare Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          move target\${{ matrix.target }}\release\ares.exe ${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # upload-artifact resolves `path` relative to GITHUB_WORKSPACE
          # (repo root), not the job's `defaults.run.working-directory` —
          # that default only applies to `run:` shell steps. Needs the
          # explicit core/ prefix here.
          path: core/${{ matrix.artifact_name }}

  publish-github-release:
    name: Publish GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip Artifacts
        run: |
          mkdir -p release_assets
          for dir in artifacts/*/; do
            asset_name=$(basename "$dir")
            if [[ "$asset_name" == *".exe" ]]; then
              zip -j "release_assets/${asset_name%%.exe}.zip" "$dir/$asset_name"
            else
              tar -czvf "release_assets/${asset_name}.tar.gz" -C "$dir" "$asset_name"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-crates-io:
    name: Publish to Crates.io
    needs: publish-github-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Publish core libraries first, then CLI
          cargo publish -p ares-core
          cargo publish -p ares-trident
          cargo publish -p ares-policy
          cargo publish -p ares-mapper
          cargo publish -p ares-v3
