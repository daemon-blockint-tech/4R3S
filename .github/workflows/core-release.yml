name: Core Release

# Renamed from "Release" on import (ENG-1: pulled ARES-v3 in as core/).
#
# The dry run this file used to ask for has now been done, and it does not pass.
# `cargo publish --dry-run -p ares-trident` fails because **crates.io `ares-core`
# is not ours** — it is an unrelated project ("Core types, traits, and error
# handling for Ares AI scraper", Apache-2.0). With a version on the path
# dependency, cargo resolves that stranger's crate for the verification build and
# the compile fails on `AresError` (theirs is `AppError`). Every other name we
# want is free; only `ares-core` is taken.
#
# So no tag can publish to crates.io until `ares-core` is renamed to a free name.
# That is a naming/ownership decision, not something to settle in a workflow file
# — see CLAUDE.md's treatment of the LICENSE discrepancy for the same posture.
# Until it is settled, verify-crates-io fails and gates publish-github-release, so
# a tag cannot leave behind an immutable public release whose crates.io half does
# not exist. Fail-closed is the point; do not un-gate it to get a release out.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ares-linux-amd64
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ares-linux-arm64
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ares-macos-amd64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ares-macos-arm64
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ares-windows-amd64.exe
            use_cross: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Target
        if: matrix.use_cross == false
        run: cargo build --release --target ${{ matrix.target }} --bin ares

      - name: Build Target (Cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --bin ares

      - name: Prepare Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mv target/${{ matrix.target }}/release/ares ${{ matrix.artifact_name }}
          chmod +x ${{ matrix.artifact_name }}

      - name: Prepare Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          move target\${{ matrix.target }}\release\ares.exe ${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          # upload-artifact resolves `path` relative to GITHUB_WORKSPACE
          # (repo root), not the job's `defaults.run.working-directory` —
          # that default only applies to `run:` shell steps. Needs the
          # explicit core/ prefix here.
          path: core/${{ matrix.artifact_name }}

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-and-release, verify-crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Zip Artifacts
        run: |
          mkdir -p release_assets
          for dir in artifacts/*/; do
            asset_name=$(basename "$dir")
            if [[ "$asset_name" == *".exe" ]]; then
              zip -j "release_assets/${asset_name%%.exe}.zip" "$dir/$asset_name"
            else
              tar -czvf "release_assets/${asset_name}.tar.gz" -C "$dir" "$asset_name"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

  # Runs BEFORE anything is made public. A GitHub release is immutable once
  # created, so a crates.io failure discovered after it exists leaves a tagged
  # release advertising a crates.io half that does not exist. Every reason the
  # publish can fail — a missing version on a path dependency, a crate missing
  # `description`, a dependency that is not in the publish list, a tag that does
  # not match the workspace version — is detectable here for free.
  verify-crates-io:
    name: Verify Crates.io Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Nothing derives the crate version from the tag, so without this a v0.1.1
      # tag silently tries to publish whatever workspace.package.version says.
      - name: Tag matches workspace version
        run: |
          crate_version="$(cargo pkgid -p ares-v3 | sed 's/.*@//')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match core/Cargo.toml version $crate_version" >&2
            exit 1
          fi

      - name: Dry-run publish
        run: |
          for crate in ares-core ares-trident ares-mapper ares-policy ares-report ares-orchestrator ares-v3; do
            cargo publish --dry-run -p "$crate"
          done

  publish-crates-io:
    name: Publish to Crates.io
    needs: publish-github-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Topological order: every crate is published after everything it
        # depends on, or its verification build cannot resolve them from the
        # registry. ares-orchestrator and ares-report were missing entirely,
        # and ares-v3 depends on both.
        run: |
          cargo publish -p ares-core
          cargo publish -p ares-trident
          cargo publish -p ares-mapper
          cargo publish -p ares-policy
          cargo publish -p ares-report
          cargo publish -p ares-orchestrator
          cargo publish -p ares-v3
