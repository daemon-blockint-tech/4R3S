name: ares-sec CI

# Renamed from "ARES CI" on import (SEC-1: import ares-sec into apps/ares-sec)
# to avoid colliding with the existing root ci.yml. Scoped to only trigger on
# changes under apps/ares-sec/, matching core-ci.yml's pattern.
# NOTE: the SEC-1 import is incomplete. The `src/target/` source directory was
# dropped during import (it matched the root .gitignore's unanchored `target/`
# rule, now fixed) and is not yet restored, so typecheck/test currently fail
# (missing './target/index.js', plus missing bench/ fixtures). Until the import
# is completed — restore apps/ares-sec/src/target/ and the bench fixtures, see
# the tracked follow-up — this workflow runs on ares-sec PRs and manual dispatch
# only, NOT on push to main, so an incomplete P3 app does not red the main
# branch's status. Re-add the `push: [main]` trigger once it is green.
on:
  pull_request:
    paths: [ "apps/ares-sec/**" ]
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/ares-sec

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ares-sec/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # SEC-4: the coordinated-disclosure pipeline (OSV + live PoC + refuter),
      # drafts-only. This self-test is hermetic — no network, no toolchain, no
      # LLM key — so it runs green in CI where those are all absent.
      - run: npm run test:disclose:pipeline
      - run: npm run doctor
      # Honesty gates: prove the headline numbers re-derive and that no
      # challenge-fitting has crept in. Public contributors / CI can verify.
      - run: npm run verify-claims
      - run: npm run test:no-fitting
      - run: npm run test:no-self-fitting
      # The provenance gate itself, in the compiled engine path (builds first).
      - run: npm run test:gate
      # The operator doctrine / prompt-pack contract must hold.
      - run: npm run prompt:audit
      # Non-network smoke: core traps run deterministically; server/live tiers
      # auto-skip when no server/LLM is present (they are absent in CI).
      - run: npm run smoke
