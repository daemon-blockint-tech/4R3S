name: Core CI

# Renamed from "CI" on import (ENG-1: pulled ARES-v3 in as core/) to avoid
# colliding with the existing TypeScript ci.yml. Scoped to only trigger on
# changes under core/, so unrelated TS-only commits don't spin up a Rust
# toolchain for nothing.
on:
  push:
    branches: [ "main" ]
    # ENG-2: the new VulnerabilityCategory<->VULN_CATALOG consistency test in
    # ares-core reads both files below via include_str!() -- they live
    # outside core/, so they must be listed explicitly or a PR touching only
    # one of them would never trigger this workflow.
    paths: [ "core/**", "src/knowledge/vuln-catalog.generated.json", "eval/mappings/ares-core-categories.json", ".github/workflows/core-ci.yml" ]
  # No `paths:` filter here, deliberately — it costs a Rust toolchain on
  # TS-only PRs and buys the ability to make these three jobs REQUIRED.
  #
  # That trade is settled by how main went red: a grouped Dependabot cargo bump
  # (printpdf 0.7 -> 0.12.5) failed Core CI and was merged anyway. Branch
  # protection is the fix, and it cannot cover a path-filtered workflow: GitHub
  # does not treat a required check that never runs as satisfied, it parks the
  # PR on "Expected — waiting for status to be reported" forever. So the filter
  # and the requirement are mutually exclusive, and the requirement is the half
  # that stops the incident.
  #
  # `push` above keeps its filter. Nothing is gated on push, so there is no
  # deadlock to avoid there and no reason to spend the minutes twice.
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: core

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Run tests
        run: cargo test --workspace

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Use cargo-audit directly rather than rustsec/audit-check@v2: on `push`
      # events that action fails the check on informational unmaintained/unsound
      # warnings, not just vulnerabilities. Plain `cargo audit` fails ONLY on
      # vulnerabilities and leaves warnings informational — the intended gate.
      # The ignored IDs are DoS-class advisories accepted on the ENG-1 import,
      # tracked for a follow-up dep bump. Two of the three bumps are still
      # outstanding: quick-xml is 0.39.4 (needs >=0.41) and crossbeam-epoch is
      # 0.9.18 (needs >=0.9.20).
      #
      # RUSTSEC-2026-0187 (lopdf stack overflow, needs >=0.42) is NO LONGER
      # ignored: the printpdf 0.7 -> 0.12.5 bump pulled lopdf 0.44.0, so the
      # advisory does not apply. Dropped rather than left in place, because
      # `cargo audit --ignore` accepts an ID that matches nothing without
      # complaint — a stale entry silently pre-approves the vulnerability's
      # return. Re-add only with a fresh justification.
      - name: Audit
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0204
