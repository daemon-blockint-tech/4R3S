name: Core CI

# Renamed from "CI" on import (ENG-1: pulled ARES-v3 in as core/) to avoid
# colliding with the existing TypeScript ci.yml. Scoped to only trigger on
# changes under core/, so unrelated TS-only commits don't spin up a Rust
# toolchain for nothing.
on:
  push:
    branches: [ "main" ]
    # ENG-2: the new VulnerabilityCategory<->VULN_CATALOG consistency test in
    # ares-core reads both files below via include_str!() -- they live
    # outside core/, so they must be listed explicitly or a PR touching only
    # one of them would never trigger this workflow.
    paths: [ "core/**", "src/knowledge/vuln-catalog.generated.json", "eval/mappings/ares-core-categories.json", ".github/workflows/core-ci.yml" ]
  # No `paths:` filter on pull_request, deliberately, and it costs a Rust
  # toolchain on TS-only PRs.
  #
  # These three jobs have to be *required* status checks, because the incident
  # that made that necessary was a cargo bump merged into a red main. But
  # GitHub cannot require a check that does not report: a path-filtered
  # workflow simply never runs on an unrelated PR, and branch protection then
  # parks that PR on "Expected — waiting for status to be reported" forever.
  # The filter and the requirement are mutually exclusive, so the filter goes.
  #
  # `push` above keeps its filter — nothing is gated on push, so there is no
  # deadlock to avoid and no reason to burn the minutes twice.
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: core

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Run tests
        run: cargo test --workspace

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Use cargo-audit directly rather than rustsec/audit-check@v2: on `push`
      # events that action fails the check on informational unmaintained/unsound
      # warnings, not just vulnerabilities. Plain `cargo audit` fails ONLY on
      # vulnerabilities and leaves warnings informational — the intended gate.
      # The four ignored IDs are DoS-class advisories accepted on the ENG-1
      # import, tracked for a follow-up dep bump (lopdf>=0.42, quick-xml>=0.41,
      # crossbeam-epoch>=0.9.20). Runs in core/ via the workflow's
      # defaults.run.working-directory.
      - name: Audit
        run: cargo audit --ignore RUSTSEC-2026-0187 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0204
