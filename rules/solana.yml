# ARES static-analysis ruleset — Solana / Anchor.
#
# Pinned and committed deliberately. The previous default was `--config auto`,
# which resolves rules from the Semgrep registry over the network: that made the
# one analyzer advertising determinism depend on a remote, silently-versioned
# ruleset, and it sent an outbound request on every scan even in the offline
# configuration SECURITY.md describes.
#
# Every `id` here is exactly a VULN_CATALOG id from src/knowledge/solana-vulns.ts.
# That is load-bearing: analyze-static maps a rule id onto a catalog category, and
# an exact id spares it the substring guessing it would otherwise fall back to.
#
# This is a deliberately small, high-confidence starter set, not coverage of the
# catalog. Most classes in the catalog need dataflow or cross-function reasoning
# that a pattern matcher cannot decide (whether a signer check exists on the path
# that matters, whether a CPI target is attacker-controlled). Findings here are a
# floor, never a ceiling — see the Coverage section of the report.
#
# Type-level rules use pattern-regex because semgrep's Rust parser rejects a bare
# type as a pattern ("no pattern found"); expression rules use real patterns.
# Removed: `unsafe-type-cast` (`$X as u64|u32|usize|i64`). Measured over 173 real
# Solana programs it produced 73 of 110 total hits — 66% of everything this
# ruleset emitted — with no confirmed true positive. The pattern cannot see the
# source type, so it flags always-safe widening and the ubiquitous `as usize`
# index idiom, while missing the narrowing casts that actually truncate
# (`as u8`, `as u16`, `as u128`, `try_into().unwrap()`). Deciding a cast is
# unsafe needs the source type, which is a typed-AST question, not a regex one.
rules:
# Removed: `anchor-constraint-gap` (`\bUncheckedAccount\s*<`). Measured over 805
# files of professionally audited production programs (Squads v4, Drift v2,
# Mango v4, marginfi, Phoenix, Marinade, SPL Token, Metaplex) it produced 370 of
# 386 total hits — 96% of everything this ruleset emitted. Triaged:
#   50.0% already carry the `#[account(...)]` constraint the rule's own message
#         told them to add, so the rule flagged code that had applied its fix;
#   31.4% carry the `/// CHECK:` justification Anchor refuses to compile
#         without, i.e. every legitimate use by construction;
#   18.6% are unconstrained at the declaration and validated in the handler
#         body — which is where the answer lives and where a regex cannot look.
# `UncheckedAccount` is an Anchor idiom, not a defect. Deciding whether one is
# safe means reading the adjacent `#[account]` attribute, following the `address`
# constraint, and checking every path that reads the account: a typed-AST and
# graph question, the same wall `unsafe-type-cast` hit.
  - id: type-cosplay
    languages: [rust]
    severity: WARNING
    message: >-
      Manual Borsh deserialization from raw account data skips the 8-byte
      discriminator, so an account of a different type with the same layout
      deserializes successfully. Use `Account<'info, T>` or check a type tag.
    metadata:
      category: access-control
      cwe: "CWE-843"
    pattern-regex: '\btry_from_slice\s*\(\s*&?\s*\w+\.data\.borrow'

  - id: non-canonical-bump
    languages: [rust]
    severity: WARNING
    message: >-
      `create_program_address` accepts any bump and derives a valid-but-arbitrary
      PDA, so an attacker can pass a non-canonical bump to reach a different
      address than the one you meant to gate on. Use `find_program_address` for
      the canonical bump, or verify the supplied bump equals the canonical one.
    metadata:
      category: pda
      cwe: "CWE-345"
    pattern-regex: '\bcreate_program_address\s*\('

  - id: account-close-revival
    languages: [rust]
    severity: ERROR
    message: >-
      Manually zeroing an account's lamports closes it, but leaving the data and
      discriminator intact lets the same account be revived within the
      transaction and reused. Prefer Anchor's `close = <recipient>`; if closing
      by hand, also zero the data and assign the closed-account discriminator.
    metadata:
      category: lifecycle
      cwe: "CWE-672"
    pattern-regex: '(?:try_borrow_mut_lamports\s*\(\s*\)\s*\?|lamports\s*\(\s*\)\s*\.\s*borrow_mut\s*\(\s*\))\s*=\s*0'

# Removed: `sysvar-spoofing` (`<Sysvar>::from_account_info\s*\(`). This rule was
# factually wrong, not merely noisy. `Sysvar::from_account_info` validates the
# account key itself — solana-program/src/sysvar/mod.rs:190:
#     fn from_account_info(account_info: &AccountInfo) -> Result<Self, _> {
#         if !Self::check_id(account_info.unsigned_key()) {
#             return Err(ProgramError::InvalidArgument);
#         }
# so the flagged call cannot be spoofed, and the trait exposes no `_unchecked`
# variant to target instead. All 7 hits over 917 files of audited production
# code (SPL Token, Solend) were the safe, idiomatic native-Rust call. Real sysvar
# spoofing is hand-rolled deserialization of an unvalidated account's data — a
# structural question, not this call site.

  - id: instruction-introspection
    languages: [rust]
    severity: WARNING
    message: >-
      `load_instruction_at` reads a sibling instruction by absolute index without
      verifying the runtime bounds/correlation the checked variant enforces, so a
      caller can reorder or spoof the introspected instruction. Use
      `load_instruction_at_checked` (with a relative index) and validate the
      sibling's program id and accounts before trusting it.
    metadata:
      category: logic
      cwe: "CWE-841"
    # `load_instruction_at(` cannot match `load_instruction_at_checked(` — the
    # `(` must follow `at` directly — so the correct API is excluded for free
    # without a lookahead (unsupported by Semgrep's re2 engine).
    pattern-regex: '\bload_instruction_at\s*\('
